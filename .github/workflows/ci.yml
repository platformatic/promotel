---
name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use supported Node.js Version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Generate protobuf types
        run: npm run generate:proto-types

      - name: Build project
        run: npm run build

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run all tests
        run: npm test

      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo "=== Test App Logs ==="
          docker logs promotel-test-test-app-1 || true
          echo "=== OTEL Collector Logs ==="
          docker logs promotel-test-otel-collector-1 || true
          echo "=== Prometheus Logs ==="
          docker logs promotel-test-prometheus-1 || true

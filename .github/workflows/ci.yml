---
name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # Every major in the @platformatic/prom-client peer range (Watt ships 1.x)
        prom-client: ['1', '2']
    name: Node.js ${{ matrix.node-version }} / prom-client ${{ matrix.prom-client }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use supported Node.js Version
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Install @platformatic/prom-client ${{ matrix.prom-client }}.x
        run: |
          npm install --no-save --ignore-scripts "@platformatic/prom-client@^${PROM_CLIENT_MAJOR}.0.0"
          VERSION="$(node -p "require('@platformatic/prom-client/package.json').version")"
          echo "Testing against @platformatic/prom-client@${VERSION}"
          if [ "${VERSION%%.*}" != "${PROM_CLIENT_MAJOR}" ]; then
            echo "::error::Expected @platformatic/prom-client ${PROM_CLIENT_MAJOR}.x, got ${VERSION}"
            exit 1
          fi
        env:
          PROM_CLIENT_MAJOR: ${{ matrix.prom-client }}

      - name: Generate protobuf types
        run: npm run generate:proto-types

      - name: Build project
        run: npm run build

      - name: Test packed package
        run: npm run test:pack

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run all tests
        run: npm test

      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo "=== Test App Logs ==="
          docker logs promotel-test-test-app-1 || true
          echo "=== OTEL Collector Logs ==="
          docker logs promotel-test-otel-collector-1 || true
          echo "=== Prometheus Logs ==="
          docker logs promotel-test-prometheus-1 || true

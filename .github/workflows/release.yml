name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number to tag and release'
        required: true
        type: string
      prerelease:
        description: 'Release as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release-npm:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use supported Node.js Version
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Bump Version
        run: node scripts/bump-version.ts "${{ inputs.version }}" "${{ github.actor }}"
        env:
          GITHUB_ACTIONS: 'true'

      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}

      - name: Update npm
        run: npm install -g npm@11.16.0

      - name: Publish to NPM
        run: npm publish --provenance --access public --tag ${{ inputs.prerelease == true && 'next' || 'latest' }}

      - name: Create release notes
        run: npx @matteo.collina/release-notes -a ${{ secrets.GH_RELEASE_TOKEN }} -t v${{ inputs.version }} -r promotel -o platformatic ${{ github.event.inputs.prerelease == 'true' && '-p' || '' }} -c ${{ github.ref }}
